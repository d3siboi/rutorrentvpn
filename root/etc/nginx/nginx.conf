pid /var/run/nginx/nginx.pid;
user hotio;
worker_processes 2;
worker_rlimit_nofile 8192;
error_log /proc/self/fd/2 info;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    aio threads;
    sendfile on;

    ## Keepalive
    keepalive_timeout     15;
    keepalive_disable     msie6;
    keepalive_requests    100;

    ## TCP options
    tcp_nopush  on;
    tcp_nodelay on;

    ## Temp folders — created by service-nginx's run script before nginx starts
    client_body_temp_path /tmp/nginx 1 2;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Log
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    # Routine request logging goes to a file, not stdout — ruTorrent's own
    # UI polls its backend every few seconds (httprpc, cpuload, diskspace),
    # which would otherwise flood `docker logs` with noise on every single
    # poll. error_log stays on /proc/self/fd/2 (docker logs) since that's
    # where actual problems belong; this is just the routine access trail.
    access_log /config/log/nginx-access.log main;

    ## Hide the Nginx version number
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
